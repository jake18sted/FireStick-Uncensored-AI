name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireStick-Uncensored-AI-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: v1.8 - Lustify + Wan Enhanced (uncensored)
          body: |
            v1.8: Prompt-only images now use lustify-v8 (uncensored). Videos use Wan 2.7 Enhanced (uncensored) instead of Seedance to avoid black screens and NSFW filtering on person images and adult prompts.
            
            Direct download: https://github.com/jake18sted/FireStick-Uncensored-AI/releases/download/v1.8/app-release.apk
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true
